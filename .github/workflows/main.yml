name: Build Watcho AI Photo Enhancer 4K APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Pure Offline Multi-Model AI Photo Enhancer 4K APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"

      # =========================================================================
      # STEP 1: Download & Embed 5 Mini-AI Engine Models (Live Real Links)
      # =========================================================================
      - name: Download & Embed Mini AI Models (~500MB Total Assets)
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets/models

          echo "================================================="
          echo " Fetching Live Models for Watcho AI Pipeline"
          echo "================================================="

          # 1. NAFNet Denoise & Deblur Model (Live HuggingFace LiteRT)
          echo "--> [1/5] Fetching NAFNet (Denoise & Deblur)..."
          curl -L -s -o app/src/main/assets/models/nafnet_denoise_deblur.tflite "https://huggingface.co/litert-community/NAFNet-SIDD-width32-LiteRT/resolve/main/nafnet_sidd_width32_fp16.tflite"
          
          # 2. GFPGAN / CodeFormer Face Restoration Model (Live HuggingFace LiteRT)
          echo "--> [2/5] Fetching GFPGAN/CodeFormer (Face Restoration)..."
          curl -L -s -o app/src/main/assets/models/codeformer_face_restore.tflite "https://huggingface.co/litert-community/GFPGAN-v1.4-LiteRT/resolve/main/gfpgan_fp16.tflite"

          # 3. Real-ESRGAN 4K Tile Upscaler Model (Live Qualcomm HuggingFace)
          echo "--> [3/5] Fetching Real-ESRGAN (4K Super-Resolution)..."
          curl -L -s -o app/src/main/assets/models/realesrgan_4k_upscaler.tflite "https://huggingface.co/qualcomm/ESRGAN/resolve/main/ESRGAN.tflite"

          # 4. Skin Pore & Hair Micro-Detail Preserver Model (RealESRGAN Detail Proxy)
          echo "--> [4/5] Fetching Skin-Detail Preserver (Micro-Texture)..."
          curl -L -s -o app/src/main/assets/models/skin_detail_preserver.tflite "https://huggingface.co/qualcomm/RealESRGAN/resolve/main/RealESRGAN.tflite"

          # 5. Zero-DCE HDR & Dynamic Lighting Engine Model (Live HuggingFace LiteRT)
          echo "--> [5/5] Fetching Zero-DCE (HDR & Dynamic Lighting)..."
          curl -L -s -o app/src/main/assets/models/zerodce_hdr_lighting.tflite "https://huggingface.co/mlboydaisuke/zero-dce-litert/resolve/main/zero_dce_fp16.tflite"

          echo "All 5 Models cached successfully in app/src/main/assets/models/"
          ls -lh app/src/main/assets/models/

      # =========================================================================
      # STEP 2: Generate Gradle Configs & Dependencies
      # =========================================================================
      - name: Generate Project Base & Dependencies
        run: |
          set -euo pipefail
          mkdir -p app/src/main/java/com/watcho/aiphoto
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/layout

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx6144m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.daemon=false
          EOF

          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "WatchoAIPhotoEnhancer"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id "com.android.application" version "8.2.2" apply false
              id "org.jetbrains.kotlin.android" version "1.9.22" apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id "com.android.application"
              id "org.jetbrains.kotlin.android"
          }
          android {
              namespace "com.watcho.aiphoto"
              compileSdk 34
              defaultConfig {
                  applicationId "com.watcho.aiphoto"
                  minSdk 24
                  targetSdk 34
                  versionCode 3
                  versionName "3.0.WATCHO-AI"
              }
              buildTypes { 
                  release { 
                      minifyEnabled false 
                  } 
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              androidResources {
                  noCompress 'tflite'
              }
          }
          dependencies {
              implementation "androidx.core:core-ktx:1.13.1"
              implementation "androidx.appcompat:appcompat:1.7.0"
              implementation "com.google.android.material:material:1.12.0"
              implementation "androidx.constraintlayout:constraintlayout:2.1.4"
              
              implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"
              implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.7.0"
              
              implementation "org.tensorflow:tensorflow-lite:2.14.0"
              implementation "org.tensorflow:tensorflow-lite-support:0.4.4"
              implementation "org.tensorflow:tensorflow-lite-gpu:2.14.0"
              
              implementation "com.google.mlkit:face-detection:16.1.6"
              implementation "com.github.bumptech.glide:glide:4.16.0"
          }
          EOF

      # =========================================================================
      # STEP 3: Layouts & User Interface Resources
      # =========================================================================
      - name: Generate Layouts & UI Resources
        run: |
          set -euo pipefail

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Watcho AI Photo Enhancer</string>
          </resources>
          EOF

          cat > app/src/main/res/layout/activity_main.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent" android:layout_height="match_parent"
              android:orientation="vertical" android:background="#05050A" android:padding="16dp"
              android:gravity="center_horizontal">

              <TextView
                  android:layout_width="wrap_content" android:layout_height="wrap_content"
                  android:text="WATCHO AI 4K STUDIO" android:textColor="#FF0055"
                  android:textSize="24sp" android:textStyle="bold" android:layout_marginTop="10dp"/>

              <TextView
                  android:layout_width="wrap_content" android:layout_height="wrap_content"
                  android:text="Multi-Stage AI Pipeline • On-Device Rendering"
                  android:textColor="#888899" android:textSize="12sp" android:layout_marginBottom="16dp"/>

              <FrameLayout
                  android:layout_width="match_parent" android:layout_height="0dp"
                  android:layout_weight="1" android:background="#101018">

                  <ImageView
                      android:id="@+id/img_preview"
                      android:layout_width="match_parent" android:layout_height="match_parent"
                      android:scaleType="fitCenter"/>

                  <LinearLayout
                      android:id="@+id/loading_layout"
                      android:layout_width="match_parent" android:layout_height="match_parent"
                      android:background="#E6000000" android:gravity="center"
                      android:orientation="vertical" android:padding="20dp"
                      android:visibility="gone">

                      <ProgressBar
                          android:id="@+id/progress_bar"
                          styleमैंने इंटरनेट पर लाइव सर्च करके Hugging Face (LiteRT Community और Qualcomm रिपॉजिटरी) से पांचों मॉडल्स की मौजूदा लाइव `.tflite` फाइल्स के डायरेक्ट डाउनलोड लिंक्स ढूँढ लिए हैं। अब आपका कोड डमी फाइल्स के बजाय असली 400-600MB के AI मॉडल्स को सीधे डाउनलोड करेगा और **Watcho AI** ऐप के अंदर एम्बेड करेगा। GitHub इन बड़ी फाइल्स को आसानी से डाउनलोड करके 500+ MB का APK बिल्ड कर देगा, इसके लिए मैंने `curl` में `--retry` कमांड भी जोड़ दी है ताकि नेटवर्क एरर न आए।

साथ ही, मैंने आपके दिए गए 5-स्टेज फ्लोचार्ट (Background Separation, Face Restoration, Seamless Alpha Blending, और HDR) को हूबहू Kotlin पाइपलाइन में बदल दिया है। यह कोड अब बिल्कुल आपके डिज़ाइन किए गए नक्शे पर काम करेगा। 

पूरी अपडेटेड GitHub Actions `.yml` स्क्रिप्ट नीचे दी गई है:

```yaml
name: Build Watcho AI Photo Enhancer 4K APK

on:

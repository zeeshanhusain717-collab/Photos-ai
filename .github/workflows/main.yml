          # 5. Zero-DCE HDR & Dynamic Lighting Engine Model (Live from Daisuke's LiteRT Port)
          echo "--> [5/5] Fetching Zero-DCE (HDR & Dynamic Lighting)..."
          curl -L --retry 3 -s -o app/src/main/assets/models/zerodce_hdr_lighting.tflite "[https://huggingface.co/mlboydaisuke/zero-dce-litert/resolve/main/zero-dce_fp16.tflite](https://huggingface.co/mlboydaisuke/zero-dce-litert/resolve/main/zero-dce_fp16.tflite)"

          echo "All 5 Live AI Engine Models downloaded successfully!"
          ls -lh app/src/main/assets/models/

      # =========================================================================
      # STEP 2: Generate Gradle Configs & Dependencies
      # =========================================================================
      - name: Generate Project Base & Dependencies
        run: |
          set -euo pipefail
          mkdir -p app/src/main/java/com/watcho/aiphoto
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/layout

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx6144m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.daemon=false
          EOF

          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "WatchoAIPhotoEnhancer"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id "com.android.application" version "8.2.2" apply false
              id "org.jetbrains.kotlin.android" version "1.9.22" apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id "com.android.application"
              id "org.jetbrains.kotlin.android"
          }
          android {
              namespace "com.watcho.aiphoto"
              compileSdk 34
              defaultConfig {
                  applicationId "com.watcho.aiphoto"
                  minSdk 24
                  targetSdk 34
                  versionCode 3
                  versionName "3.0.WATCHO-AI"
              }
              buildTypes { 
                  release { 
                      minifyEnabled false 
                  } 
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              androidResources {
                  noCompress 'tflite'
              }
          }
          dependencies {
              implementation "androidx.core:core-ktx:1.13.1"
              implementation "androidx.appcompat:appcompat:1.7.0"
              implementation "com.google.android.material:material:1.12.0"
              implementation "androidx.constraintlayout:constraintlayout:2.1.4"
              
              implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"
              implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.7.0"
              
              implementation "org.tensorflow:tensorflow-lite:2.14.0"
              implementation "org.tensorflow:tensorflow-lite-support:0.4.4"
              implementation "org.tensorflow:tensorflow-lite-gpu:2.14.0"
              
              implementation "com.google.mlkit:face-detection:16.1.6"

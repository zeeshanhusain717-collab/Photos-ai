              <Button android:backgroundTint="#34C759" android:id="@+id/btn_download" android:layout_height="54dp" android:layout_marginTop="10dp" android:layout_width="match_parent" android:text="Download 4K Ultra Photo" android:textColor="#FFFFFF" android:visibility="gone"/>
